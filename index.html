<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blank Screen · Gemini Aurora</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #05060d;
    color: #e8eaf0;
    overflow: hidden;
  }

  /* ============ THEME LAYER ============ */
  .theme { position: fixed; inset: 0; opacity: 1; pointer-events: none; }
  #t-fx canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* ============ UI ============ */
  .topbar {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-radius: 999px;
    background: rgba(20, 24, 34, 0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
  }
  .topbar label {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.65;
    user-select: none;
  }
  .topbar select {
    appearance: none;
    background: transparent;
    border: none;
    outline: none;
    color: inherit;
    font: 600 14px "Inter", -apple-system, sans-serif;
    cursor: pointer;
    padding: 4px 6px;
  }
  .topbar select option { background: #171a23; color: #e8eaf0; }

  .hint {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    font-size: 12px;
    letter-spacing: 0.05em;
    opacity: 0.4;
    user-select: none;
  }
</style>
</head>
<body>

  <!-- single theme: Aurora Curtains in Gemini's 4 signature colors -->
  <div class="theme" id="t-fx"><canvas id="fx-canvas"></canvas></div>

  <div class="topbar">
    <label for="theme-select">Theme</label>
    <select id="theme-select">
      <option value="curtains">Aurora Curtains — Gemini</option>
    </select>
  </div>

  <div class="hint" id="hint">a blank screen, your way</div>

<script>
  const select = document.getElementById('theme-select');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ============================================================
     AURORA CURRANTS — Gemini signature palette.
     Google's four brand colors cycle through drifting sine
     curtains; fbm turbulence bends the fabric.
     ============================================================ */
  const FX_W = 240, FX_H = 135;
  const pixel = document.createElement('canvas');
  pixel.width = FX_W; pixel.height = FX_H;
  const pctx = pixel.getContext('2d');
  const idata = pctx.createImageData(FX_W, FX_H);
  const buf = idata.data;
  const fxCanvas = document.getElementById('fx-canvas');
  const fxCtx = fxCanvas.getContext('2d');

  /* Gemini's 4 signature colors: blue → green → yellow → red */
  const GEMINI = [
    [66, 133, 244],    // #4285F4  blue
    [52, 168, 83],     // #34A853  green
    [249, 171, 0],     // #F9AB00  yellow
    [234, 67, 53]      // #EA4335  red
  ];

  function hash2(x, y) {
    let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  function vnoise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash2(xi, yi), b = hash2(xi + 1, yi);
    const c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, oct) {
    let s = 0, amp = 0.5, f = 1;
    for (let i = 0; i < oct; i++) { s += amp * vnoise(x * f, y * f); f *= 2; amp *= 0.5; }
    return s;
  }

  /* 4-stop cyclic palette: p in [0,1) wraps blue→green→yellow→red→blue */
  function geminiColor(p) {
    const n = p * 4;
    const i = Math.floor(n) % 4;
    const f = n - Math.floor(n);
    const a = GEMINI[i], b = GEMINI[(i + 1) % 4];
    return [
      (a[0] + (b[0] - a[0]) * f) | 0,
      (a[1] + (b[1] - a[1]) * f) | 0,
      (a[2] + (b[2] - a[2]) * f) | 0
    ];
  }

  function renderCurtains(t) {
    const W = FX_W, H = FX_H;
    for (let y = 0, i = 0; y < H; y++) {
      const v = y / H;
      for (let x = 0; x < W; x++, i += 4) {
        const u = x / W;
        /* 4 phase-locked sine curtains, vertical wobble via field sine */
        let a = 0;
        for (let k = 0; k < 4; k++) {
          a += Math.sin(u * (7 + k * 1.8) + t * (0.55 + k * 0.11)
            + Math.sin(v * 3.5 + t * 0.4 + k * 1.7) * 2.6);
        }
        a /= 4;
        const m = fbm(u * 2.6, v * 2.3 + t * 0.07, 3);
        const b = Math.pow(a * 0.5 + 0.5, 2.2);   // band intensity 0..1
        /* color sweeps full blue→green→yellow→red cycle across the width,
           flowing with time — all 4 Gemini colors visible at once */
        const p = (u * 1.1 + t * 0.06 + m * 0.25) % 1;
        const c = geminiColor(p);
        /* brightness: curtain depth falloff, band fade at edges */
        const k = 0.22 + Math.min(1, b * (1.25 - v * 0.9)) * 0.8;
        buf[i]     = (c[0] * k) | 0;
        buf[i + 1] = (c[1] * k) | 0;
        buf[i + 2] = (c[2] * k) | 0;
        buf[i + 3] = 255;
      }
    }
  }

  /* ---------- render loop (pauses when hidden / reduced motion) ---------- */
  function fitFx() {
    if (fxCanvas.width !== innerWidth || fxCanvas.height !== innerHeight) {
      fxCanvas.width = innerWidth; fxCanvas.height = innerHeight;
    }
  }
  let t0 = null, lastT = 0;
  function fxFrame(ts) {
    if (!reduceMotion && !document.hidden) {
      if (t0 === null) t0 = ts - lastT;
      const t = (ts - t0) / 1000;
      renderCurtains(t);
      pctx.putImageData(idata, 0, 0);
      fitFx();
      fxCtx.imageSmoothingEnabled = true;
      fxCtx.drawImage(pixel, 0, 0, innerWidth, innerHeight);
      lastT = t * 1000;
    }
    requestAnimationFrame(fxFrame);
  }
  if (reduceMotion) {
    renderCurtains(0);
    pctx.putImageData(idata, 0, 0);
    fitFx();
    fxCtx.drawImage(pixel, 0, 0, innerWidth, innerHeight);
  } else {
    requestAnimationFrame(fxFrame);
  }
  addEventListener('resize', () => {
    if (reduceMotion) {
      renderCurtains(0);
      pctx.putImageData(idata, 0, 0);
      fitFx();
      fxCtx.drawImage(pixel, 0, 0, innerWidth, innerHeight);
    }
  });
</script>
</body>
</html>
